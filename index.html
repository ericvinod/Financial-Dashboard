<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Flow Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#0a1220;
  --bg-soft:#0d1a2b;
  --panel:#111f33;
  --panel-2:#0f1c2e;
  --line:#1e3350;
  --teal:#2dd4b0;
  --teal-dim:#1c8f77;
  --blue:#4aa8e0;
  --amber:#f0a93a;
  --coral:#f0645a;
  --text:#eaf3f0;
  --text-dim:#8fa8bb;
  --text-faint:#5d7690;
  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 85% -10%, #123a34 0%, transparent 60%),
             radial-gradient(900px 500px at -10% 110%, #0e2740 0%, transparent 55%),
             var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#1e3350;border-radius:8px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex:none;background:var(--panel-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 16px;gap:26px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px;}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover;box-shadow:0 4px 16px rgba(45,212,176,.35);}
.brand .name{font-family:'Sora';font-weight:700;font-size:15.5px;line-height:1.15;}
.brand .sub{font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav button{
  all:unset;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;transition:.15s;
}
.nav button svg{width:17px;height:17px;flex:none;}
.nav button:hover{background:#132743;color:var(--text);}
.nav button.active{background:linear-gradient(90deg,#12332c,#0f2a37);color:var(--teal);font-weight:600;box-shadow:inset 2px 0 0 var(--teal);}
.sidebar-foot{margin-top:auto;font-size:11px;color:var(--text-faint);padding:0 6px;line-height:1.5;}

.main{flex:1;min-width:0;padding:30px 34px 60px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.page-head h1{font-size:23px;font-weight:700;}
.page-head p{color:var(--text-dim);font-size:13.5px;margin-top:5px;}

.btn{
  display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 16px;
  font-size:13.5px;font-weight:600;transition:.15s;
}
.btn-primary{background:linear-gradient(135deg,#2dd4b0,#1f9e83);color:#062019;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:#132743;color:var(--text);border:1px solid var(--line);}
.btn-ghost:hover{background:#193052;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-danger{background:#2a1418;color:#f18a83;border:1px solid #4a2027;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px;}
.grid-5{grid-template-columns:repeat(5,1fr);}
.grid-2{grid-template-columns:1.4fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1200px){.grid-5{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:760px){.grid-5{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr;}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;}
.stat-card{position:relative;overflow:hidden;}
.stat-card .label{font-size:11.5px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.stat-card .value{font-family:'Sora';font-size:25px;font-weight:700;margin-top:9px;}
.stat-card .foot{font-size:12px;color:var(--text-faint);margin-top:6px;}
.stat-card .foot.up{color:var(--coral);}
.stat-card .foot.down{color:var(--teal);}
.stat-card .glyph{position:absolute;right:14px;top:14px;opacity:.5;width:20px;height:20px;color:var(--teal);}

.card h3{font-size:14.5px;font-weight:700;margin-bottom:2px;}
.card .card-sub{font-size:12px;color:var(--text-faint);margin-bottom:16px;}

/* ---------- Budget rows ---------- */
.budget-row{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;padding:9px 0;}
.budget-row .cat{font-size:13px;font-weight:600;}
.budget-track{height:9px;border-radius:6px;background:#0c1b2c;overflow:hidden;position:relative;}
.budget-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal-dim),var(--teal));}
.budget-fill.over{background:linear-gradient(90deg,#a34038,var(--coral));}
.budget-nums{font-size:11.5px;color:var(--text-dim);text-align:right;white-space:nowrap;}
.budget-nums b{color:var(--text);}
.tag-over{color:var(--coral);font-weight:700;}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 10px;border-bottom:1px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid #16283f;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#0f2036;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:#132a3f;color:var(--blue);white-space:nowrap;}
.pill.mode{background:#1a2f22;color:var(--teal);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.icon-btn{background:none;border:none;color:var(--text-faint);padding:5px;border-radius:6px;display:inline-flex;}
.icon-btn:hover{background:#193052;color:var(--text);}
.icon-btn svg{width:15px;height:15px;}
.empty-row td{text-align:center;color:var(--text-faint);padding:34px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,9,16,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:26px;}
.modal h2{font-size:18px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:#0b1a2b;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-dim);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;font-size:12.5px;color:var(--text-faint);text-align:center;}
.tab-toggle{display:flex;gap:6px;margin-bottom:10px;}
.tab-toggle button{all:unset;flex:1;text-align:center;padding:7px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-faint);background:#0b1a2b;border:1px solid var(--line);}
.tab-toggle button.on{color:var(--teal);border-color:var(--teal-dim);background:#0e2620;}

/* ---------- misc ---------- */
.section-title{font-size:14.5px;font-weight:700;margin:26px 0 12px;color:var(--text);}
.month-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.month-chip{padding:8px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.month-chip.active{color:#062019;background:linear-gradient(135deg,#2dd4b0,#1f9e83);border-color:transparent;}
.month-chip:hover{color:var(--text);}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:10px;align-items:flex-start;border:1px solid var(--line);}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px;}
.alert.warn{background:#2a1f0f;border-color:#4a3a17;}
.alert.warn svg{color:var(--amber);}
.alert.danger{background:#2a1418;border-color:#4a2027;}
.alert.danger svg{color:var(--coral);}
.alert.info{background:#0f2233;border-color:#1c3a55;}
.alert.info svg{color:var(--blue);}
.alert .t{font-size:13px;font-weight:600;}
.alert .d{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
.recur-card{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:9px;}
.recur-card .nm{font-size:13.5px;font-weight:600;}
.recur-card .meta{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.due-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#132a3f;color:var(--blue);}
.due-badge.soon{background:#2a1f0f;color:var(--amber);}
.due-badge.today{background:#2a1418;color:var(--coral);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-day{aspect-ratio:1;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);padding:7px;font-size:11.5px;color:var(--text-faint);position:relative;}
.cal-day .n{font-weight:600;color:var(--text-dim);}
.cal-day.has-due{border-color:var(--teal-dim);background:#0e2620;}
.cal-day .dot{position:absolute;bottom:6px;left:7px;right:7px;font-size:9.5px;color:var(--teal);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-day.muted{opacity:.35;}
.bill-view img{max-width:100%;border-radius:10px;}
.bill-view iframe{width:100%;height:65vh;border:none;border-radius:10px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--teal-dim);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.loading{color:var(--text-faint);font-size:13px;padding:30px;text-align:center;}
.savings-donut-wrap{display:flex;align-items:center;gap:18px;}
.mode-list{display:flex;flex-direction:column;gap:10px;flex:1;}
.mode-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.mode-item .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
.mode-item .amt{font-weight:700;font-family:'Sora';}
</style>
</head>

const fmt = n => "₹" + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:0});
const fmt1 = n => Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:1});
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthLabel = k => { const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'}); };
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();

/* =============================================================================
   STATE
============================================================================= */
let STATE = { expenses: [], budgets: [], income: [], recurring: [], emi: [], loaded:false };
let selectedHistoryMonth = null;

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* =============================================================================
   DATA LAYER
============================================================================= */
async function loadAll(){
  const [exp, bud, inc, rec, emi] = await Promise.all([
    db.from('expenses').select('*').order('entry_date',{ascending:false}),
    db.from('budgets').select('*'),
    db.from('income_sources').select('*'),
    db.from('recurring_expenses').select('*').order('next_due',{ascending:true, nullsFirst:false}),
    db.from('credit_card_emi').select('*'),
  ]);
  STATE.expenses = exp.data || [];
  STATE.budgets = bud.data || [];
  STATE.income = inc.data || [];
  STATE.recurring = rec.data || [];
  STATE.emi = emi.data || [];
  STATE.loaded = true;
  STATE.error = exp.error || bud.error || inc.error || rec.error || emi.error || null;
}

async function saveExpense(payload, id){
  if(id){
    payload.updated_at = new Date().toISOString();
    const {error} = await db.from('expenses').update(payload).eq('id', id);
    if(error) throw error;
  } else {
    const {error} = await db.from('expenses').insert(payload);
    if(error) throw error;
  }
}
async function deleteExpense(id){
  const {error} = await db.from('expenses').delete().eq('id', id);
  if(error) throw error;
}
async function uploadBill(file){
  const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const {error} = await db.storage.from('bills').upload(path, file, {upsert:true});
  if(error) throw error;
  const { data } = db.storage.from('bills').getPublicUrl(path);
  return { url: data.publicUrl, type: file.type.includes('pdf') ? 'pdf' : 'image', name: file.name };
}

============================================================================= */
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['dashboard','history','recurring','insights'].forEach(t=>{
    document.getElementById('view-'+t).style.display = (t===btn.dataset.tab) ? '' : 'none';
  });
  if(btn.dataset.tab === 'history') renderHistory();
  if(btn.dataset.tab === 'recurring') renderRecurring();
  if(btn.dataset.tab === 'insights') renderInsights();
});

/* =============================================================================
   DASHBOARD (current month)
============================================================================= */
function currentMonthExpenses(){
  const now = new Date();
  const mk = monthKey(now);
  return STATE.expenses.filter(e => monthKey(new Date(e.entry_date)) === mk);
}

function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  if(!STATE.loaded){ el.innerHTML = `<div class="loading">Loading your numbers…</div>`; return; }
  if(STATE.error){ el.innerHTML = errorBlock(STATE.error); return; }

  const now = new Date();
  const cur = currentMonthExpenses();
  const totalIncome = STATE.income.reduce((s,i)=>s+Number(i.amount),0);
  const totalOutflow = cur.reduce((s,e)=>s+Number(e.amount),0);
  const netSavings = totalIncome - totalOutflow;
  const savingsRate = totalIncome ? (netSavings/totalIncome*100) : 0;
  const totalBudget = STATE.budgets.reduce((s,b)=>s+Number(b.monthly_budget),0);
  const burnRate = totalBudget ? (totalOutflow/totalBudget*100) : 0;
  const dim = daysInMonth(now.getFullYear(), now.getMonth());
  const daysLeft = dim - now.getDate();

  const byCategory = {};
  CATEGORIES.forEach(c=>byCategory[c]=0);
  cur.forEach(e => byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount));

  const byMode = {};
  MODES.forEach(m=>byMode[m]=0);
  cur.forEach(e => byMode[e.paid_by] = (byMode[e.paid_by]||0) + Number(e.amount));

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Overview — ${now.toLocaleString('en-IN',{month:'long',year:'numeric'})}</h1>
        <p>Budget vs actual, spend by mode, and this month's entries.</p>
      </div>
      <button class="btn btn-primary" id="btn-add-expense">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Add expense
      </button>
    </div>

    <div class="grid grid-5">
      ${statCard('Monthly income', fmt(totalIncome), `${STATE.income.length} source${STATE.income.length!==1?'s':''}`, 'neutral', iconWallet())}
      ${statCard('Monthly outflow', fmt(totalOutflow), `${cur.length} entries logged`, 'neutral', iconOut())}
      ${statCard('Net cash flow', fmt(netSavings), netSavings>=0 ? 'On track this month' : 'Spending exceeds income', netSavings>=0?'down':'up', iconFlow())}
      ${statCard('Savings rate', fmt1(savingsRate)+'%', 'of take-home income kept', savingsRate>=20?'down':'up', iconPercent())}
      ${statCard('Budget burn', fmt1(burnRate)+'%', `${daysLeft} day${daysLeft!==1?'s':''} left in cycle`, burnRate>90?'up':'neutral', iconGauge())}
    </div>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>Budget vs actual</h3>
        <div class="card-sub">Spending against your monthly allocation, by category</div>
        <div id="budget-rows"></div>
      </div>
      <div class="card">
        <h3>Spend by payment mode</h3>
        <div class="card-sub">${now.toLocaleString('en-IN',{month:'long'})} outflow split across accounts</div>
        <div class="savings-donut-wrap">
          <canvas id="mode-donut" width="150" height="150"></canvas>
          <div class="mode-list">
            ${MODES.map(m=>`
              <div class="mode-item">
                <span><span class="dot" style="background:${MODE_COLORS[m]}"></span>${m}</span>
                <span class="amt">${fmt(byMode[m])}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="section-title">This month's entries</div>
    <div class="card" style="padding:8px 20px 20px;">
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Paid by</th><th>Bill</th><th style="text-align:right">Amount</th><th></th></tr></thead>
        <tbody id="expense-rows"></tbody>
      </table>
    </div>
  `;

  document.getElementById('btn-add-expense').onclick = () => openExpenseModal();

  // budget rows
  const rows = document.getElementById('budget-rows');
  const budgetMap = {}; STATE.budgets.forEach(b=>budgetMap[b.category]=Number(b.monthly_budget));
  rows.innerHTML = CATEGORIES.map(cat=>{
    const spent = byCategory[cat]||0;
    const budget = budgetMap[cat]||0;
    const pct = budget ? Math.min(150,(spent/budget*100)) : (spent>0?150:0);
    const over = budget && spent>budget;
    return `<div class="budget-row">
      <div class="cat">${cat}</div>
      <div class="budget-track"><div class="budget-fill ${over?'over':''}" style="width:${Math.min(100,pct)}%"></div></div>
      <div class="budget-nums">${over?'<span class="tag-over">over</span> ':''}<b>${fmt(spent)}</b> / ${fmt(budget)}</div>
    </div>`;
  }).join('');

  // expense table
  const tbody = document.getElementById('expense-rows');
  if(cur.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No expenses logged yet this month. Click "Add expense" to start.</td></tr>`;
  } else {
    tbody.innerHTML = cur.map(e=>expenseRowHtml(e)).join('');
  }
  bindExpenseRowEvents(tbody);

  // donut chart
  const ctx = document.getElementById('mode-donut');
  if(ctx){
    new Chart(ctx, {
      type:'doughnut',
      data:{ labels: MODES, datasets:[{ data: MODES.map(m=>byMode[m]), backgroundColor: MODES.map(m=>MODE_COLORS[m]), borderWidth:0 }] },
      options:{ cutout:'68%', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed)}}} }
    });
  }
}

function expenseRowHtml(e){
  const billIcon = e.bill_url ? `<button class="icon-btn view-bill" data-url="${e.bill_url}" data-type="${e.bill_type||'link'}" title="View bill">${iconPaperclip()}</button>` : `<span style="color:var(--text-faint);font-size:12px;">—</span>`;
  return `<tr data-id="${e.id}">
    <td class="mono" style="color:var(--text-dim);font-size:12px;">${new Date(e.entry_date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</td>
    <td>${escapeHtml(e.description)}${e.notes?`<div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">${escapeHtml(e.notes)}</div>`:''}</td>
    <td><span class="pill">${e.category}</span></td>
    <td><span class="pill mode">${e.paid_by}</span></td>
    <td>${billIcon}</td>
    <td style="text-align:right;font-weight:700;font-family:'Sora';">${fmt(e.amount)}</td>
    <td>
      <div class="row-actions">
        <button class="icon-btn edit-exp" title="Edit">${iconEdit()}</button>
        <button class="icon-btn del-exp" title="Delete">${iconTrash()}</button>
      </div>
    </td>
  </tr>`;
}

function bindExpenseRowEvents(container){
  container.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id = tr.dataset.id;
    const record = STATE.expenses.find(x=>String(x.id)===String(id));
    const editBtn = tr.querySelector('.edit-exp');
    const delBtn = tr.querySelector('.del-exp');
    const billBtn = tr.querySelector('.view-bill');
    if(editBtn) editBtn.onclick = () => openExpenseModal(record);
    if(delBtn) delBtn.onclick = () => confirmDelete(record);
    if(billBtn) billBtn.onclick = () => openBillViewer(billBtn.dataset.url, billBtn.dataset.type);
  });
}

function confirmDelete(record){
  openModal(`
    <h2>Delete this entry?</h2>
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:6px;">${escapeHtml(record.description)} — ${fmt(record.amount)}</p>
    <p style="color:var(--text-faint);font-size:12.5px;">This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-del">Cancel</button>
      <button class="btn btn-danger" id="confirm-del">Delete entry</button>
    </div>
  `);
  document.getElementById('cancel-del').onclick = closeModal;
  document.getElementById('confirm-del').onclick = async ()=>{
    try{ await deleteExpense(record.id); toast('Entry deleted'); closeModal(); await refreshAndRender(); }
    catch(err){ toast('Could not delete: '+err.message); }
  };
}

function openBillViewer(url, type){
  let body;
  if(type==='pdf') body = `<iframe src="${url}"></iframe>`;
  else if(type==='image') body = `<img src="${url}">`;
  else body = `<p style="font-size:13.5px;">This bill is stored as a link.</p><a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">Open bill ↗</a>`;
  openModal(`<h2>Attached bill</h2><div class="bill-view">${body}</div><div class="modal-actions"><button class="btn btn-ghost" id="close-bill">Close</button></div>`);
  document.getElementById('close-bill').onclick = closeModal;
}

        <select id="f-mode">${MODES.map(m=>`<option ${isEdit&&record.paid_by===m?'selected':''}>${m}</option>`).join('')}</select>

    </div>
    <div class="field">
      <label>Bill (optional)</label>
      <div class="tab-toggle">
        <button type="button" class="on" id="mode-upload">Upload file</button>
        <button type="button" id="mode-link">Google Drive link</button>
      </div>
      <div id="bill-upload-block">
        <div class="file-drop" id="file-drop-zone">
          <input type="file" id="f-file" accept="image/*,application/pdf" style="display:none;">
          <span id="file-drop-label">${isEdit && record.bill_url && record.bill_type!=='link' ? 'A bill is already attached — choose a file to replace it' : 'Click to attach a photo or PDF of the bill'}</span>
        </div>
      </div>
      <div id="bill-link-block" style="display:none;">
        <input id="f-link" type="text" placeholder="https://drive.google.com/..." value="${isEdit && record.bill_type==='link' ? escapeAttr(record.bill_url) : ''}">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-exp">Cancel</button>
      <button class="btn btn-primary" id="save-exp">${isEdit?'Save changes':'Add expense'}</button>
    </div>
  `);

  document.getElementById('cancel-exp').onclick = closeModal;
  document.getElementById('file-drop-zone').onclick = ()=>document.getElementById('f-file').click();
  document.getElementById('f-file').onchange = (e)=>{
    pendingBillFile = e.target.files[0] || null;
    document.getElementById('file-drop-label').textContent = pendingBillFile ? `Selected: ${pendingBillFile.name}` : 'Click to attach a photo or PDF of the bill';
  };
  document.getElementById('mode-upload').onclick = ()=>{
    document.getElementById('mode-upload').classList.add('on');
    document.getElementById('mode-link').classList.remove('on');
    document.getElementById('bill-upload-block').style.display='';
    document.getElementById('bill-link-block').style.display='none';

  document.getElementById('mode-link').onclick = ()=>{

    document.getElementById('mode-upload').classList.remove('on');
    document.getElementById('bill-link-block').style.display='';
    document.getElementById('bill-upload-block').style.display='none';
  };

  document.getElementById('save-exp').onclick = async ()=>{
    const desc = document.getElementById('f-desc').value.trim();

    if(!desc){ toast('Please add a description'); return; }
    if(!amount || amount<=0){ toast('Please enter a valid amount'); return; }

    const saveBtn = document.getElementById('save-exp');

    const payload = {
      description: desc,
      category: document.getElementById('f-cat').value,
      paid_by: document.getElementById('f-mode').value,
      amount: amount,
      entry_date: document.getElementById('f-date').value,
      notes: document.getElementById('f-notes').value.trim() || null,

        payload.bill_url = uploaded.url; payload.bill_type = uploaded.type; payload.bill_name = uploaded.name;
      }
      await saveExpense(payload, isEdit ? record.id : null);
      toast(isEdit ? 'Expense updated' : 'Expense added');
      closeModal();
      await refreshAndRender();
    }catch(err){
      toast('Could not save: '+err.message);
      saveBtn.textContent = isEdit?'Save changes':'Add expense'; saveBtn.disabled=false;
    }
  };
}

function renderHistory(){
  const el = document.getElementById('view-history');
  if(!STATE.loaded){ el.innerHTML = `<div class="loading">Loading history…</div>`; return; }
  if(STATE.error){ el.innerHTML = errorBlock(STATE.error); return; }

  const now = new Date();
  const curKey = monthKey(now);
  const grouped = {};
  STATE.expenses.forEach(e=>{
    const k = monthKey(new Date(e.entry_date));
    if(k===curKey) return;
    (grouped[k] = grouped[k]||[]).push(e);
  });
  const months = Object.keys(grouped).sort();

  if(!selectedHistoryMonth || !grouped[selectedHistoryMonth]) selectedHistoryMonth = months[months.length-1] || null;

  el.innerHTML = `
    <div class="page-head">
      <div><h1>History</h1><p>Trends across previous months. Pick a month to see the breakdown.</p></div>
    </div>
    ${months.length===0 ? `<div class="card"><p style="color:var(--text-faint);font-size:13.5px;">No past months yet — once this month closes it'll show up here.</p></div>` : `
    <div class="card">
      <h3>Spend over time</h3>
      <div class="card-sub">Total monthly outflow, most recent last</div>
      <canvas id="trend-chart" height="90"></canvas>
    </div>

    <div class="section-title">Select a month</div>
    <div class="month-chip-row" id="month-chips">
      ${months.map(m=>`<button class="month-chip ${m===selectedHistoryMonth?'active':''}" data-m="${m}">${monthLabel(m)}</button>`).join('')}
    </div>
    <div id="month-detail"></div>
    `}
  `;

  if(months.length===0) return;

  document.querySelectorAll('#month-chips .month-chip').forEach(btn=>{
    btn.onclick = ()=>{ selectedHistoryMonth = btn.dataset.m; renderHistory(); };
  });

  // trend chart
  const totals = months.map(m => grouped[m].reduce((s,e)=>s+Number(e.amount),0));
  new Chart(document.getElementById('trend-chart'), {
    type:'line',
    data:{ labels: months.map(m=>monthLabel(m).replace(' 20',' \'')), datasets:[{
      data: totals, borderColor:'#2dd4b0', backgroundColor:'rgba(45,212,176,.12)', fill:true, tension:.35, pointBackgroundColor:'#2dd4b0', pointRadius:4,
    }]},
    options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}}},
      scales:{ y:{ ticks:{color:'#8fa8bb', callback:v=>'₹'+(v/1000)+'k'}, grid:{color:'#16283f'} }, x:{ ticks:{color:'#8fa8bb'}, grid:{display:false} } } }
  });

  // month detail
  const detail = document.getElementById('month-detail');
  const items = grouped[selectedHistoryMonth];
  const total = items.reduce((s,e)=>s+Number(e.amount),0);
  const byCat = {};
  items.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+Number(e.amount));
  const topCats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  detail.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <h3>${monthLabel(selectedHistoryMonth)}</h3>
        <div class="card-sub">${items.length} entries · total ${fmt(total)}</div>
        <table>
          <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Paid by</th><th style="text-align:right">Amount</th></tr></thead>
          <tbody>${items.map(e=>`<tr>
            <td class="mono" style="color:var(--text-dim);font-size:12px;">${new Date(e.entry_date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</td>
            <td>${escapeHtml(e.description)}</td>
            <td><span class="pill">${e.category}</span></td>
            <td><span class="pill mode">${e.paid_by}</span></td>
            <td style="text-align:right;font-weight:700;">${fmt(e.amount)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="card">
        <h3>Category breakdown</h3>
        <div class="card-sub">Where ${monthLabel(selectedHistoryMonth)}'s money went</div>
        ${topCats.map(([cat,amt])=>`
          <div class="budget-row" style="grid-template-columns:140px 1fr 90px;">
            <div class="cat">${cat}</div>
            <div class="budget-track"><div class="budget-fill" style="width:${Math.min(100,amt/total*100)}%"></div></div>
            <div class="budget-nums"><b>${fmt(amt)}</b></div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function renderRecurring(){
  const el = document.getElementById('view-recurring');
  if(!STATE.loaded){ el.innerHTML = `<div class="loading">Loading recurring items…</div>`; return; }
  if(STATE.error){ el.innerHTML = errorBlock(STATE.error); return; }

  const now = new Date();
  const withDays = STATE.recurring.map(r=>{
    let daysUntil = null;
    if(r.next_due){
      const d = new Date(r.next_due);
      daysUntil = Math.ceil((d - now)/(1000*60*60*24));
    }
    return {...r, daysUntil};
  }).sort((a,b)=>(a.daysUntil??9999)-(b.daysUntil??9999));

  const totalEmi = STATE.emi.reduce((s,e)=>s+Number(e.amount),0);
  const totalRecurMonthly = STATE.recurring.reduce((s,r)=>s+Number(r.monthly_amount||0),0);

  el.innerHTML = `
    <div class="page-head">
      <div><h1>Recurring</h1><p>Insurance premiums, subscriptions and running EMIs.</p></div>
      <button class="btn btn-ghost" id="btn-add-recurring">

      ${statCard('Recurring premiums', fmt(totalRecurMonthly), 'averaged monthly', 'neutral', iconShield())}
      ${statCard('Next due', withDays[0]&&withDays[0].daysUntil!=null ? withDays[0].daysUntil+' day'+(withDays[0].daysUntil===1?'':'s') : '—', withDays[0]?withDays[0].name:'nothing scheduled', 'neutral', iconCalendar())}
    </div>

    <div class="grid grid-2" style="margin-top:16px;">
      <div class="card">
        <h3>Upcoming calendar</h3>
        <div class="card-sub">${now.toLocaleString('en-IN',{month:'long',year:'numeric'})}</div>
        <div id="mini-calendar"></div>
      </div>
      <div class="card">
        <h3>Insurance & bills</h3>
        <div class="card-sub">Sorted by next due date</div>
        <div id="recurring-list"></div>
      </div>
    </div>

    <div class="section-title">Running credit card EMIs</div>
    <div class="card" style="padding:8px 20px 20px;">
      <table>
        <thead><tr><th>Card</th><th>Product</th><th>Progress</th><th style="text-align:right">EMI amount</th></tr></thead>
        <tbody>
          ${STATE.emi.length===0 ? `<tr class="empty-row"><td colspan="4">No EMIs recorded.</td></tr>` :
          STATE.emi.map(e=>`<tr><td><span class="pill mode">${e.card}</span></td><td>${escapeHtml(e.product)}</td><td class="mono" style="color:var(--text-dim)">${e.emi_progress||'—'}</td><td style="text-align:right;font-weight:700;">${fmt(e.amount)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('recurring-list').innerHTML = withDays.length===0 ? `<p style="color:var(--text-faint);font-size:13px;">Nothing scheduled.</p>` :
    withDays.map(r=>{
      let badge = '';
      if(r.daysUntil!=null){
        const cls = r.daysUntil<=0 ? 'today' : (r.daysUntil<=14 ? 'soon' : '');
        badge = `<span class="due-badge ${cls}">${r.daysUntil<=0?'due now':r.daysUntil+'d'}</span>`;
      }
      return `<div class="recur-card">
        <div>
          <div class="nm">${escapeHtml(r.name)}</div>
          <div class="meta">${r.frequency||''}${r.next_due?' · due '+new Date(r.next_due).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):''}${r.monthly_amount?' · '+fmt(r.monthly_amount)+'/mo':''}</div>
        </div>
        ${badge}
      </div>`;
    }).join('');

  // mini calendar for current month
  const cal = document.getElementById('mini-calendar');
  const y = now.getFullYear(), m = now.getMonth();
  const dim = daysInMonth(y,m);
  const firstDow = new Date(y,m,1).getDay();

  STATE.recurring.forEach(r=>{
    if(!r.next_due) return;

    if(d.getFullYear()===y && d.getMonth()===m) dueMap[d.getDate()] = (dueMap[d.getDate()]||[]).concat(r.name);
  });
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day muted"></div>`;
  for(let d=1; d<=dim; d++){
    const items = dueMap[d];
    cells += `<div class="cal-day ${items?'has-due':''}"><div class="n">${d}</div>${items?`<div class="dot" title="${items.join(', ')}">${items[0]}</div>`:''}</div>`;
  }
  cal.innerHTML = `<div class="cal-grid">${cells}</div>`;

  document.getElementById('btn-add-recurring').onclick = () => openRecurringModal();

/* =============================================================================
   INSIGHTS
============================================================================= */
function renderInsights(){
  const el = document.getElementById('view-insights');
  if(!STATE.loaded){ el.innerHTML = `<div class="loading">Crunching insights…</div>`; return; }
  if(STATE.error){ el.innerHTML = errorBlock(STATE.error); return; }

  const now = new Date();
  const curKey = monthKey(now);
  const prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevKey = monthKey(prevDate);

  const curItems = STATE.expenses.filter(e=>monthKey(new Date(e.entry_date))===curKey);
  const prevItems = STATE.expenses.filter(e=>monthKey(new Date(e.entry_date))===prevKey);

  const sumBy = (items,key) => { const m={}; items.forEach(e=>m[e[key]]=(m[e[key]]||0)+Number(e.amount)); return m; };
  const curByCat = sumBy(curItems,'category');
  const prevByCat = sumBy(prevItems,'category');
  const budgetMap = {}; STATE.budgets.forEach(b=>budgetMap[b.category]=Number(b.monthly_budget));

  const alerts = [];

  // overspending
  CATEGORIES.forEach(cat=>{
    const spent = curByCat[cat]||0, budget = budgetMap[cat]||0;
    if(budget && spent > budget){
      const pct = ((spent-budget)/budget*100).toFixed(0);
      alerts.push({type:'danger', title:`${cat} is over budget`, desc:`₹${Math.round(spent-budget).toLocaleString('en-IN')} over — ${pct}% above the ${fmt(budget)} allocation this month.`});
    }
  });

  // month over month swings
  Object.keys(prevByCat).forEach(cat=>{
    const prev = prevByCat[cat], cur = curByCat[cat]||0;
    if(prev>0){
      const change = ((cur-prev)/prev*100);
      if(Math.abs(change) >= 20){
        alerts.push({
          type: change>0?'warn':'info',
          title: `${cat} is ${change>0?'up':'down'} ${Math.abs(change).toFixed(0)}% this month`,
          desc: `${fmt(prev)} last month → ${fmt(cur)} so far this month.`
        });
      }
    }
  });

  // unusual single charges — vs historical average for that category (excluding current month)
  const historical = STATE.expenses.filter(e=>monthKey(new Date(e.entry_date))!==curKey);
  const histAvgByCat = {};
  CATEGORIES.forEach(cat=>{
    const items = historical.filter(e=>e.category===cat);
    if(items.length>=2){
      histAvgByCat[cat] = items.reduce((s,e)=>s+Number(e.amount),0)/items.length;
    }
  });
  curItems.forEach(e=>{
    const avg = histAvgByCat[e.category];
    if(avg && Number(e.amount) > avg*2){
      alerts.push({type:'warn', title:`Unusual charge: ${e.description}`, desc:`${fmt(e.amount)} on ${e.category} — about ${(Number(e.amount)/avg).toFixed(1)}× the typical spend in this category.`});
    }
  });

  // upcoming bills due within 14 days
  STATE.recurring.forEach(r=>{
    if(!r.next_due) return;
    const days = Math.ceil((new Date(r.next_due) - now)/(1000*60*60*24));
    if(days>=0 && days<=14){
      alerts.push({type:'info', title:`${r.name} due in ${days} day${days===1?'':'s'}`, desc:`${r.premium_amount?fmt(r.premium_amount)+' · ':''}${new Date(r.next_due).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}`});
    }
  });

  const totalIncome = STATE.income.reduce((s,i)=>s+Number(i.amount),0);
  const totalOutflow = curItems.reduce((s,e)=>s+Number(e.amount),0);
  if(totalIncome && totalOutflow > totalIncome*0.9 && totalOutflow <= totalIncome){
    alerts.push({type:'warn', title:'Cutting it close this month', desc:`You've used ${(totalOutflow/totalIncome*100).toFixed(0)}% of income already, with days still left in the cycle.`});
  }
  if(totalIncome && totalOutflow > totalIncome){
    alerts.push({type:'danger', title:'Spending has exceeded income', desc:`${fmt(totalOutflow)} spent against ${fmt(totalIncome)} income this month.`});
  }

  el.innerHTML = `
    <div class="page-head">
      <div><h1>Insights</h1><p>Automatic takeaways from this month's activity.</p></div>
    </div>
    ${alerts.length===0 ? `
      <div class="card">
        <p style="color:var(--text-dim);font-size:13.5px;">No alerts right now — spending looks steady across categories and nothing unusual has come up.</p>
      </div>` :
      `<div class="card">${alerts.map(a=>`
        <div class="alert ${a.type}">
          ${a.type==='danger'?iconAlertTriangle():a.type==='warn'?iconAlertCircle():iconInfo()}
          <div><div class="t">${a.title}</div><div class="d">${a.desc}</div></div>
        </div>`).join('')}</div>`
    }
  `;
}

/* =============================================================================
   MODAL / TOAST HELPERS
============================================================================= */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="overlay" id="overlay"><div class="modal">${html}</div></div>`;
  document.getElementById('overlay').addEventListener('mousedown', e=>{ if(e.target.id==='overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

function statCard(label, value, foot, footClass, icon){
  return `<div class="card stat-card">
    <div class="glyph">${icon}</div>
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    <div class="foot ${footClass}">${foot}</div>
  </div>`;
}
function errorBlock(err){
  return `<div class="card"><h3 style="color:var(--coral)">Couldn't load data</h3><p style="color:var(--text-dim);font-size:13px;">${escapeHtml(err.message||String(err))}</p><p style="color:var(--text-faint);font-size:12.5px;margin-top:8px;">Check that the setup script has been run and the tables exist.</p></div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* icons */
function iconWallet(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>`;}
